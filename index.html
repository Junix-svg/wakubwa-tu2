
<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WAKUBWA TU2</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #101010;
  color: white;
  font-family: Arial, sans-serif;
}

header {
  background: #181818;
  padding: 18px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 2px solid #c9a227;
}

.logo {
  color: #e2bd45;
  font-size: 21px;
  font-weight: bold;
}

button {
  background: #d6ad35;
  color: #111;
  border: none;
  padding: 12px 16px;
  border-radius: 6px;
  font-weight: bold;
  cursor: pointer;
}

button:hover { background: #f0ca54; }

.hero {
  text-align: center;
  padding: 65px 20px;
  background: linear-gradient(135deg,#292929,#111);
}

.hero h1 {
  font-size: 34px;
  color: #e2bd45;
}

.hero p {
  color: #ccc;
  line-height: 1.6;
}

.section { padding: 25px 20px; }

.section h2 { color: #e2bd45; }

.search {
  width: 100%;
  max-width: 500px;
  display: block;
  margin: 20px auto;
  padding: 14px;
  border-radius: 7px;
  border: 1px solid #555;
  background: #202020;
  color: white;
  font-size: 16px;
}

.videos {
  display: grid;
  grid-template-columns: repeat(auto-fit,minmax(220px,1fr));
  gap: 18px;
}

.video {
  background: #202020;
  border-radius: 10px;
  overflow: hidden;
  border: 1px solid #383838;
}

.thumbnail {
  height: 145px;
  background: linear-gradient(135deg,#383838,#171717);
  display: grid;
  place-items: center;
  font-size: 45px;
  color: #d6ad35;
}

.video-info { padding: 15px; }

.description {
  color: #bbb;
  line-height: 1.5;
}

.price {
  color: #e2bd45;
  font-weight: bold;
  font-size: 18px;
}

.empty {
  color: #aaa;
  text-align: center;
  padding: 35px 10px;
  grid-column: 1 / -1;
}

#status {
  color: #d6ad35;
  text-align: center;
  padding: 10px;
}

footer {
  text-align: center;
  padding: 25px;
  color: #999;
  background: #181818;
  margin-top: 35px;
}

/* AGE CONFIRMATION */

#ageGate {
  position: fixed;
  inset: 0;
  z-index: 9999;
  background: rgba(0,0,0,.97);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.age-box {
  width: 100%;
  max-width: 420px;
  text-align: center;
  padding: 30px 22px;
  background: #1c1c1c;
  border: 2px solid #c9a227;
  border-radius: 14px;
}

.age-box h1 {
  color: #e2bd45;
  font-size: 30px;
}

.age-box p {
  color: #ccc;
  line-height: 1.6;
}

.age-buttons {
  display: flex;
  gap: 12px;
  justify-content: center;
  flex-wrap: wrap;
  margin-top: 25px;
}

#noBtn {
  background: #444;
  color: white;
}

@media(max-width:480px) {
  .hero h1 { font-size: 27px; }
  .logo { font-size: 18px; }
}
</style>
</head>

<body>

<!-- AGE GATE -->
<div id="ageGate">
  <div class="age-box">
    <h1>WAKUBWA TU2</h1>
    <h2 id="ageTitle">18+ Only</h2>
    <p id="ageText">
      Je, una miaka 18 au zaidi na unakubali kuendelea?
    </p>

    <div class="age-buttons">
      <button id="yesBtn">Ndiyo, nina miaka 18+</button>
      <button id="noBtn">Hapana</button>
    </div>

    <p id="ageMessage"></p>
  </div>
</div>

<header>
  <div class="logo">WAKUBWA TU2</div>
  <button id="langBtn">English</button>
</header>

<section class="hero">
  <h1 id="welcome">Karibu WAKUBWA TU2</h1>
  <p id="intro">Jukwaa lako la kutazama video.</p>
  <button id="exploreBtn">Tazama Video</button>
</section>

<section class="section">
  <h2 id="heading">Video Zetu</h2>

  <input
    type="search"
    class="search"
    id="searchInput"
    placeholder="Tafuta video..."
  >

  <p id="status">Inatafuta video...</p>
  <div class="videos" id="videos"></div>
</section>

<footer>
  © 2026 WAKUBWA TU2. All Rights Reserved.
</footer>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";

import {
  getFirestore,
  collection,
  onSnapshot
}
from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyABabgh9pONkM6tr50mQUpXRnnxBF8Wf3c",
  authDomain: "wakubwa-tu2.firebaseapp.com",
  projectId: "wakubwa-tu2",
  storageBucket: "wakubwa-tu2.firebasestorage.app",
  messagingSenderId: "399469319991",
  appId: "1:399469319991:web:dc665855a312c69dacacb2"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const videosContainer = document.getElementById("videos");
const status = document.getElementById("status");

let english = false;
let currentVideos = [];

// AGE CONFIRMATION

const ageGate = document.getElementById("ageGate");

if (localStorage.getItem("wakubwaAgeConfirmed") === "yes") {
  ageGate.style.display = "none";
}

document.getElementById("yesBtn").onclick = () => {
  localStorage.setItem("wakubwaAgeConfirmed", "yes");
  ageGate.style.display = "none";
};

document.getElementById("noBtn").onclick = () => {
  document.getElementById("ageMessage").textContent =
    "Huwezi kuendelea ikiwa huna miaka 18.";
};

// LANGUAGE SWITCH

document.getElementById("langBtn").onclick = () => {
  english = !english;

  document.getElementById("langBtn").textContent =
    english ? "Kiswahili" : "English";

  document.getElementById("welcome").textContent =
    english ? "Welcome to WAKUBWA TU2" : "Karibu WAKUBWA TU2";

  document.getElementById("intro").textContent =
    english ? "Your video platform." : "Jukwaa lako la kutazama video.";

  document.getElementById("heading").textContent =
    english ? "Our Videos" : "Video Zetu";

  document.getElementById("exploreBtn").textContent =
    english ? "Explore Videos" : "Tazama Video";

  document.getElementById("searchInput").placeholder =
    english ? "Search videos..." : "Tafuta video...";

  renderVideos(currentVideos);
};

document.getElementById("exploreBtn").onclick = () => {
  document.getElementById("videos").scrollIntoView({
    behavior: "smooth"
  });
};

// VIDEO SEARCH

document.getElementById("searchInput").oninput = () => {
  renderVideos(currentVideos);
};

// DISPLAY VIDEOS

function renderVideos(data) {
  videosContainer.innerHTML = "";

  const searchTerm =
    document.getElementById("searchInput").value.toLowerCase();

  const filtered = data.filter(video =>
    (video.title || "").toLowerCase().includes(searchTerm) ||
    (video.description || "").toLowerCase().includes(searchTerm)
  );

  if (filtered.length === 0) {
    const empty = document.createElement("p");
    empty.className = "empty";

    empty.textContent = english
      ? "No videos found."
      : "Hakuna video zilizopatikana.";

    videosContainer.appendChild(empty);
    return;
  }

  filtered.forEach(video => {
    const card = document.createElement("div");
    card.className = "video";

    const thumbnail = document.createElement("div");
    thumbnail.className = "thumbnail";
    thumbnail.textContent = "▶";

    const info = document.createElement("div");
    info.className = "video-info";

    const title = document.createElement("h3");
    title.textContent = video.title || "Untitled";

    const description = document.createElement("p");
    description.className = "description";
    description.textContent = video.description || "";

    const price = document.createElement("p");
    price.className = "price";
    price.textContent =
      "TSh " + Number(video.price || 0).toLocaleString("en-US");

    const button = document.createElement("button");
    button.textContent = english ? "Buy Video" : "Nunua Video";

    button.onclick = () => {
      alert(
        english
          ? "Payment system is not connected yet."
          : "Mfumo wa malipo bado haujaunganishwa."
      );
    };

    info.append(title, description, price, button);
    card.append(thumbnail, info);
    videosContainer.appendChild(card);
  });
}

// FIREBASE LIVE CONNECTION

onSnapshot(
  collection(db, "publicVideos"),

  snapshot => {
    currentVideos = snapshot.docs.map(doc => ({
      id: doc.id,
      ...doc.data()
    }));

    status.textContent = "";
    renderVideos(currentVideos);
  },

  error => {
    console.error(error);

    status.textContent = english
      ? "Unable to load videos. Please try again."
      : "Imeshindikana kupakia video. Jaribu tena.";
  }
);

</script>
</body>
</html>
