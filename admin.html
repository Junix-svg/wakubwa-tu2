
<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WAKUBWA TU2 - Admin</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:20px 12px;background:#101010;color:white;font-family:Arial,sans-serif}
.container{max-width:650px;margin:auto}
header{text-align:center;color:#d6ad55;margin-bottom:25px}
.card{background:#1d1d1d;border:1px solid #444;border-radius:12px;padding:18px;margin-bottom:18px}
input,textarea{width:100%;padding:13px;margin:8px 0 14px;border:1px solid #555;border-radius:7px;background:#111;color:white;font-size:15px}
label{color:#d6ad55;font-weight:bold}
button{width:100%;padding:14px;margin-top:10px;border:0;border-radius:7px;background:#d6ad55;color:#111;font-weight:bold;font-size:16px}
button:disabled{opacity:.5}
.secondary{background:#444;color:white}
#dashboard{display:none}
#status{color:#d6ad55;margin-top:15px;white-space:pre-wrap}
.small{color:#aaa;font-size:13px}
#imagePreview{display:none;width:100%;max-height:230px;object-fit:contain;border-radius:8px;margin:8px 0;background:#111}
.video-item{padding:13px;border-bottom:1px solid #444;overflow-wrap:anywhere}
.video-item img{width:100%;max-height:180px;object-fit:cover;border-radius:8px}
</style>
</head>
<body>
<div class="container">

<header>
<h1>WAKUBWA TU2</h1>
<p>ADMIN DASHBOARD</p>
</header>

<section class="card" id="loginSection">
<h2>Admin Login</h2>
<label>Email</label>
<input id="email" type="email" placeholder="Admin email">
<label>Password</label>
<input id="password" type="password" placeholder="Password">
<button id="loginBtn">LOGIN</button>
<p id="loginStatus"></p>
</section>

<section id="dashboard">
<div class="card">
<h2>Ongeza Video</h2>

<label>Jina la Video</label>
<input id="videoTitle" type="text" placeholder="Andika jina la video">

<label>Maelezo</label>
<textarea id="videoDescription" placeholder="Maelezo ya video"></textarea>

<label>Bei ya Video (TZS)</label>
<input id="videoPrice" type="number" min="0" step="1" placeholder="Mfano 2000">

<label>Chagua Picha ya Video kutoka Gallery</label>
<input id="thumbnailFile" type="file" accept="image/*">
<img id="imagePreview" alt="Picha ya video utakayochagua">
<p class="small">Chagua picha inayoitambulisha video. Picha itapunguzwa ukubwa kiotomatiki.</p>

<label>Chagua Video kutoka Gallery</label>
<input id="videoFile" type="file" accept="video/*">

<button id="addVideoBtn">PAKIA VIDEO</button>
<p id="status"></p>
</div>

<div class="card">
<h2>Video Zilizowekwa</h2>
<div id="videoList">Inapakia...</div>
</div>

<button id="logoutBtn" class="secondary">LOGOUT</button>
</section>
</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
import {
 getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut
} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";
import {
 getFirestore,collection,doc,writeBatch,getDocs,serverTimestamp
} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";
import {createClient} from "https://esm.sh/@supabase/supabase-js@2";

const firebaseConfig={
 apiKey:"AIzaSyABabgh9pONkM6tr50mQUpXRnnxBF8Wf3c",
 authDomain:"wakubwa-tu2.firebaseapp.com",
 projectId:"wakubwa-tu2",
 storageBucket:"wakubwa-tu2.firebasestorage.app",
 messagingSenderId:"399469319991",
 appId:"1:399469319991:web:dc665855a312c69dacacb2"
};

const ADMIN_UID="5qFt5nEK7UeEN3Ff1TGl0gms2ll2";
const SUPABASE_URL="https://usaifuvsmgjtkyzvrphf.supabase.co";
const SUPABASE_KEY="sb_publishable_ZRo_VHCQCv6Ghv7_PxkJaA_oaQGXL0S";
const BUCKET="wakubwa-tu2-videos";
const FUNCTION_URL=SUPABASE_URL+"/functions/v1/admin-video-upload";

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);
const supabase=createClient(SUPABASE_URL,SUPABASE_KEY);

const $=id=>document.getElementById(id);
const showStatus=message=>$("status").textContent=message;

$("loginBtn").onclick=async()=>{
 const email=$("email").value.trim();
 const password=$("password").value;
 $("loginStatus").textContent="Inaingia...";
 try{
  await signInWithEmailAndPassword(auth,email,password);
  $("loginStatus").textContent="";
 }catch(error){
  $("loginStatus").textContent="Login imeshindikana: "+error.message;
 }
};

onAuthStateChanged(auth,async user=>{
 if(user&&user.uid===ADMIN_UID){
  $("loginSection").style.display="none";
  $("dashboard").style.display="block";
  await loadVideos();
 }else{
  $("dashboard").style.display="none";
  $("loginSection").style.display="block";
  if(user){
   await signOut(auth);
   $("loginStatus").textContent="Akaunti hii haina ruhusa ya Admin.";
  }
 }
});

/* PUNGUZA UKUBWA WA PICHA */
async function prepareThumbnail(file){
 if(!file || !file.type.startsWith("image/")){
  throw new Error("Chagua picha sahihi kutoka Gallery.");
 }

 const imageUrl=URL.createObjectURL(file);

 try{
  const image=new Image();
  image.src=imageUrl;
  await new Promise((resolve,reject)=>{
   image.onload=resolve;
   image.onerror=()=>reject(new Error("Picha imeshindwa kusomeka."));
  });

  const maxWidth=480;
  const maxHeight=360;
  const ratio=Math.min(1,maxWidth/image.width,maxHeight/image.height);

  const canvas=document.createElement("canvas");
  canvas.width=Math.round(image.width*ratio);
  canvas.height=Math.round(image.height*ratio);

  const context=canvas.getContext("2d");
  context.drawImage(image,0,0,canvas.width,canvas.height);

  return canvas.toDataURL("image/jpeg",0.65);
 }finally{
  URL.revokeObjectURL(imageUrl);
 }
}

/* ONESHA PREVIEW YA PICHA */
$("thumbnailFile").addEventListener("change",async()=>{
 const file=$("thumbnailFile").files[0];
 const preview=$("imagePreview");

 if(!file){
  preview.style.display="none";
  return;
 }

 try{
  preview.src=await prepareThumbnail(file);
  preview.style.display="block";
 }catch(error){
  showStatus(error.message);
  preview.style.display="none";
 }
});

/* PATA RUHUSA YA SUPABASE */
async function getUploadToken(file){
 const user=auth.currentUser;
 if(!user||user.uid!==ADMIN_UID)throw new Error("Admin hajathibitishwa.");

 const idToken=await user.getIdToken();

 const response=await fetch(FUNCTION_URL,{
  method:"POST",
  headers:{
   "Content-Type":"application/json",
   "Authorization":"Bearer "+idToken,
   "apikey":SUPABASE_KEY
  },
  body:JSON.stringify({
   fileName:file.name,
   contentType:file.type||"video/mp4"
  })
 });

 const result=await response.json();

 if(!response.ok||!result.success){
  throw new Error(result.error||"Imeshindikana kupata ruhusa ya upload.");
 }
 return result;
}

/* PAKIA VIDEO */
async function uploadVideo(file,uploadInfo){
 if(!uploadInfo.path||!uploadInfo.token){
  throw new Error("Supabase haijatoa ruhusa kamili ya upload.");
 }

 const {data,error}=await supabase.storage
  .from(BUCKET)
  .uploadToSignedUrl(
   uploadInfo.path,
   uploadInfo.token,
   file,
   {contentType:file.type||"video/mp4"}
  );

 if(error)throw new Error("Supabase: "+error.message);
 if(!data)throw new Error("Supabase haijathibitisha upload.");

 return data.path;
}

/* ONGEZA VIDEO NA PICHA YAKE */
$("addVideoBtn").onclick=async()=>{
 const title=$("videoTitle").value.trim();
 const description=$("videoDescription").value.trim();
 const priceInput=$("videoPrice").value;
 const price=Number(priceInput);
 const imageFile=$("thumbnailFile").files[0];
 const videoFile=$("videoFile").files[0];

 if(!title||!imageFile||!videoFile||priceInput===""||
    !Number.isFinite(price)||price<0){
  showStatus("Jaza jina, bei sahihi, chagua picha na video.");
  return;
 }

 if(!videoFile.type.startsWith("video/")){
  showStatus("Faili ulilochagua si video.");
  return;
 }

 const button=$("addVideoBtn");
 button.disabled=true;

 try{
  showStatus("Hatua 1/4: Tunatengeneza picha ndogo...");
  const thumbnailDataUrl=await prepareThumbnail(imageFile);

  showStatus("Hatua 2/4: Tunapata ruhusa ya kupakia video...");
  const uploadInfo=await getUploadToken(videoFile);

  showStatus("Hatua 3/4: Tunapakia video...");
  const videoPath=await uploadVideo(videoFile,uploadInfo);

  showStatus("Hatua 4/4: Tunahifadhi video na picha...");
  const videoRef=doc(collection(db,"publicVideos"));
  const adminRef=doc(db,"adminData",videoRef.id);

  const batch=writeBatch(db);

  batch.set(videoRef,{
   title,
   description,
   price,
   thumbnailDataUrl,
   createdAt:serverTimestamp()
  });

  batch.set(adminRef,{
   title,
   description,
   price,
   thumbnailDataUrl,
   videoPath,
   videoFileName:videoFile.name,
   contentType:videoFile.type||"video/mp4",
   createdAt:serverTimestamp()
  });

  await batch.commit();

  showStatus("Hongera! Video na picha yake vimehifadhiwa.");

  $("videoTitle").value="";
  $("videoDescription").value="";
  $("videoPrice").value="";
  $("thumbnailFile").value="";
  $("videoFile").value="";
  $("imagePreview").style.display="none";

  await loadVideos();

 }catch(error){
  console.error(error);
  showStatus("KOSA: "+(error.message||"Hitilafu imetokea."));
 }finally{
  button.disabled=false;
 }
};

/* ORODHA YA VIDEO ZA ADMIN */
async function loadVideos(){
 const list=$("videoList");
 list.textContent="Inapakia video...";

 try{
  const snapshot=await getDocs(collection(db,"adminData"));
  list.innerHTML="";

  if(snapshot.empty){
   list.textContent="Hakuna video zilizowekwa.";
   return;
  }

  snapshot.forEach(item=>{
   const video=item.data();
   const div=document.createElement("div");
   div.className="video-item";

   if(video.thumbnailDataUrl){
    const img=document.createElement("img");
    img.src=video.thumbnailDataUrl;
    img.alt=video.title||"Picha ya video";
    div.appendChild(img);
   }

   const heading=document.createElement("strong");
   heading.textContent=video.title||"Video";

   const details=document.createElement("p");
   details.textContent="Bei: TZS "+(video.price??0);

   div.append(heading,details);
   list.appendChild(div);
  });
 }catch(error){
  list.textContent="Imeshindikana kupakia orodha: "+error.message;
 }
}

$("logoutBtn").onclick=async()=>await signOut(auth);

</script>
</body>
</html>
