
<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WAKUBWA TU2 - Admin</title>

  <style>
    body {
      margin: 0;
      background: #101010;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .box {
      background: #1d1d1d;
      padding: 28px;
      width: 85%;
      max-width: 380px;
      border-radius: 14px;
      text-align: center;
    }

    h2 { color: #d6ad55; }

    input {
      width: 95%;
      padding: 13px;
      margin: 9px 0;
      border: 1px solid #555;
      border-radius: 7px;
      background: #292929;
      color: white;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      padding: 13px;
      margin-top: 12px;
      background: #d6ad55;
      border: none;
      border-radius: 7px;
      font-weight: bold;
    }

    #dashboard { display: none; }
    #message { color: #ff7777; }
  </style>
</head>

<body>

  <div class="box">
    <h2>WAKUBWA TU2</h2>
    <p>Admin Login</p>

    <div id="login">
      <input id="email" type="email" placeholder="Admin Email">
      <input id="password" type="password" placeholder="Password">
      <button id="loginBtn">LOGIN</button>
      <p id="message"></p>
    </div>

    <div id="dashboard">
      <h3>Welcome, Admin!</h3>
      <p>Umeingia kwenye Admin Dashboard.</p>
      <button id="logoutBtn">LOGOUT</button>
    </div>
  </div>

  <script type="module">
    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";

    import {
      getAuth,
      signInWithEmailAndPassword,
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyABabgh9pONkM6tr50mQUpXRnnxBF8Wf3c",
      authDomain: "wakubwa-tu2.firebaseapp.com",
      projectId: "wakubwa-tu2",
      storageBucket: "wakubwa-tu2.firebasestorage.app",
      messagingSenderId: "399469319991",
      appId: "1:399469319991:web:dc665855a312c69dacacb2"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const login = document.getElementById("login");
    const dashboard = document.getElementById("dashboard");
    const message = document.getElementById("message");

    const ADMIN_UID = "5qFt5nEK7UeEN3Ff1TGl0gms2ll2";

    document.getElementById("loginBtn").onclick = async () => {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      message.textContent = "";

      try {
        await signInWithEmailAndPassword(auth, email, password);
      } catch (error) {
        message.textContent =
          "Login imeshindikana: " + error.code;
      }
    };

    onAuthStateChanged(auth, async (user) => {
      if (user && user.uid === ADMIN_UID) {
        login.style.display = "none";
        dashboard.style.display = "block";
      } else {
        login.style.display = "block";
        dashboard.style.display = "none";

        if (user) {
          await signOut(auth);
          message.textContent =
            "Huna ruhusa ya kuingia Admin Dashboard.";
        }
      }
    });

    document.getElementById("logoutBtn").onclick = async () => {
      await signOut(auth);
    };
  </script>

</body>
</html>
