
<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WAKUBWA TU2 - Admin</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 20px 12px;
  background: #101010;
  color: white;
  font-family: Arial, sans-serif;
}

.container { max-width: 650px; margin: auto; }

header {
  text-align: center;
  color: #d6ad55;
  margin-bottom: 25px;
}

h1 { font-size: 25px; }

.card {
  background: #1d1d1d;
  border: 1px solid #444;
  border-radius: 12px;
  padding: 18px;
  margin-bottom: 18px;
}

input, textarea {
  width: 100%;
  padding: 13px;
  margin: 8px 0 14px;
  border: 1px solid #555;
  border-radius: 7px;
  background: #111;
  color: white;
  font-size: 15px;
}

label {
  color: #d6ad55;
  font-weight: bold;
}

button {
  width: 100%;
  padding: 14px;
  margin-top: 10px;
  border: 0;
  border-radius: 7px;
  background: #d6ad55;
  color: #111;
  font-weight: bold;
  font-size: 16px;
}

button:disabled { opacity: .5; }

.secondary {
  background: #444;
  color: white;
}

.video-item {
  padding: 13px;
  border-bottom: 1px solid #444;
  overflow-wrap: anywhere;
}

#dashboard { display: none; }

#status {
  color: #d6ad55;
  margin-top: 15px;
  white-space: pre-wrap;
}

.small {
  color: #aaa;
  font-size: 13px;
}
</style>
</head>

<body>
<div class="container">

<header>
  <h1>WAKUBWA TU2</h1>
  <p>ADMIN DASHBOARD</p>
</header>

<section class="card" id="loginSection">
  <h2>Admin Login</h2>

  <label>Email</label>
  <input id="email" type="email" placeholder="Admin email">

  <label>Password</label>
  <input id="password" type="password" placeholder="Password">

  <button id="loginBtn">LOGIN</button>
  <p id="loginStatus"></p>
</section>

<section id="dashboard">

  <div class="card">
    <h2>Ongeza Video</h2>

    <label>Jina la Video</label>
    <input id="videoTitle" type="text"
      placeholder="Andika jina la video">

    <label>Maelezo</label>
    <textarea id="videoDescription"
      placeholder="Maelezo ya video"></textarea>

    <label>Bei ya Video (TZS)</label>
    <input id="videoPrice" type="number"
      min="0" step="1" placeholder="Mfano 2000">

    <label>Thumbnail URL (hiari)</label>
    <input id="thumbnailUrl" type="url"
      placeholder="https://...">

    <label>Chagua Video kutoka Gallery</label>
    <input id="videoFile" type="file" accept="video/*">

    <p class="small">
      Chagua video kutoka Gallery ya simu.
      Video itahifadhiwa kwenye private storage.
    </p>

    <button id="addVideoBtn">PAKIA VIDEO</button>
    <p id="status"></p>
  </div>

  <div class="card">
    <h2>Video Zilizowekwa</h2>
    <div id="videoList">Inapakia...</div>
  </div>

  <button id="logoutBtn" class="secondary">LOGOUT</button>
</section>

</div>

<!-- TUS browser build -->
<script src="https://cdn.jsdelivr.net/npm/tus-js-client@4/dist/tus.min.js"></script>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";

import {
  getAuth,
  signInWithEmailAndPassword,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";

import {
  getFirestore,
  collection,
  doc,
  writeBatch,
  getDocs,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyABabgh9pONkM6tr50mQUpXRnnxBF8Wf3c",
  authDomain: "wakubwa-tu2.firebaseapp.com",
  projectId: "wakubwa-tu2",
  storageBucket: "wakubwa-tu2.firebasestorage.app",
  messagingSenderId: "399469319991",
  appId: "1:399469319991:web:dc665855a312c69dacacb2"
};

const ADMIN_UID = "5qFt5nEK7UeEN3Ff1TGl0gms2ll2";

const SUPABASE_URL =
  "https://usaifuvsmgjtkyzvrphf.supabase.co";

const SUPABASE_PROJECT_ID = "usaifuvsmgjtkyzvrphf";

const SUPABASE_KEY =
  "sb_publishable_ZRo_VHCQCv6Ghv7_PxkJaA_oaQGXL0S";

const BUCKET = "wakubwa-tu2-videos";

const FUNCTION_URL =
  SUPABASE_URL + "/functions/v1/admin-video-upload";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const loginSection = document.getElementById("loginSection");
const dashboard = document.getElementById("dashboard");
const statusBox = document.getElementById("status");

function showStatus(message) {
  statusBox.textContent = message;
}

document.getElementById("loginBtn").onclick = async () => {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  document.getElementById("loginStatus").textContent = "Inaingia...";

  try {
    await signInWithEmailAndPassword(auth, email, password);
  } catch (error) {
    document.getElementById("loginStatus").textContent =
      "Login imeshindikana: " + error.message;
  }
};

onAuthStateChanged(auth, async (user) => {
  if (user && user.uid === ADMIN_UID) {
    loginSection.style.display = "none";
    dashboard.style.display = "block";
    await loadVideos();
  } else {
    dashboard.style.display = "none";
    loginSection.style.display = "block";

    if (user) {
      await signOut(auth);
      document.getElementById("loginStatus").textContent =
        "Akaunti hii haina ruhusa ya Admin.";
    }
  }
});

async function getUploadToken(file) {
  const user = auth.currentUser;

  if (!user || user.uid !== ADMIN_UID) {
    throw new Error("Admin hajathibitishwa.");
  }

  const idToken = await user.getIdToken();

  const response = await fetch(FUNCTION_URL, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "Authorization": "Bearer " + idToken,
      "apikey": SUPABASE_KEY
    },
    body: JSON.stringify({
      fileName: file.name,
      contentType: file.type
    })
  });

  let result;

  try {
    result = await response.json();
  } catch {
    throw new Error("Server haikurudisha majibu sahihi.");
  }

  if (!response.ok || !result.success) {
    throw new Error(
      result.error || "Imeshindikana kupata ruhusa ya upload."
    );
  }

  return result;
}

function uploadWithTus(file, path, token, onProgress) {
  return new Promise((resolve, reject) => {

    const Tus = window.tus;

    if (!Tus || typeof Tus.Upload !== "function") {
      reject(new Error(
        "Upload library haijapakia. Refresh ukurasa ujaribu tena."
      ));
      return;
    }

    if (!(file instanceof Blob)) {
      reject(new Error(
        "Browser haijatambua faili la video. Chagua faili tena."
      ));
      return;
    }

    const upload = new Tus.Upload(file, {
      endpoint:
        `https://${SUPABASE_PROJECT_ID}.storage.supabase.co/storage/v1/upload/resumable`,

      retryDelays: [0, 3000, 5000, 10000, 20000],

      headers: {
        "apikey": SUPABASE_KEY,
        "x-signature": token
      },

      uploadDataDuringCreation: true,
      removeFingerprintOnSuccess: true,
      chunkSize: 6 * 1024 * 1024,

      metadata: {
        bucketName: BUCKET,
        objectName: path,
        contentType: file.type || "video/mp4",
        cacheControl: "3600"
      },

      onError(error) {
        reject(error);
      },

      onProgress(bytesUploaded, bytesTotal) {
        const percentage = bytesTotal > 0
          ? Math.round((bytesUploaded / bytesTotal) * 100)
          : 0;

        onProgress(percentage);
      },

      onSuccess() {
        resolve(path);
      }
    });

    upload.start();
  });
}

document.getElementById("addVideoBtn").onclick = async () => {

  const title =
    document.getElementById("videoTitle").value.trim();

  const description =
    document.getElementById("videoDescription").value.trim();

  const price =
    Number(document.getElementById("videoPrice").value);

  const thumbnailUrl =
    document.getElementById("thumbnailUrl").value.trim();

  const file =
    document.getElementById("videoFile").files[0];

  if (!title || !file ||
      document.getElementById("videoPrice").value === "" ||
      !Number.isFinite(price) || price < 0) {
    showStatus("Jaza jina, bei sahihi na chagua video.");
    return;
  }

  if (!file.type.startsWith("video/")) {
    showStatus("Tafadhali chagua faili la video.");
    return;
  }

  const button = document.getElementById("addVideoBtn");
  button.disabled = true;

  try {
    showStatus("Hatua 1/3: Tunapata ruhusa ya upload...");

    const uploadInfo = await getUploadToken(file);

    if (!uploadInfo.path || !uploadInfo.token) {
      throw new Error("Server haijatoa taarifa kamili za upload.");
    }

    showStatus("Hatua 2/3: Tunapakia video...");

    const videoPath = await uploadWithTus(
      file,
      uploadInfo.path,
      uploadInfo.token,
      (percentage) => {
        showStatus("Video inapakiwa: " + percentage + "%");
      }
    );

    showStatus("Hatua 3/3: Tunahifadhi taarifa za video...");

    const videoRef = doc(collection(db, "publicVideos"));
    const adminRef = doc(db, "adminData", videoRef.id);

    const batch = writeBatch(db);

    batch.set(videoRef, {
      title,
      description,
      price,
      thumbnailUrl,
      createdAt: serverTimestamp()
    });

    batch.set(adminRef, {
      title,
      description,
      price,
      thumbnailUrl,
      videoPath,
      videoFileName: file.name,
      createdAt: serverTimestamp()
    });

    await batch.commit();

    showStatus("Video imepakiwa na taarifa zimehifadhiwa!");

    document.getElementById("videoTitle").value = "";
    document.getElementById("videoDescription").value = "";
    document.getElementById("videoPrice").value = "";
    document.getElementById("thumbnailUrl").value = "";
    document.getElementById("videoFile").value = "";

    await loadVideos();

  } catch (error) {
    console.error("Video upload error:", error);
    showStatus("KOSA: " + (error.message || "Hitilafu isiyojulikana."));
  } finally {
    button.disabled = false;
  }
};

async function loadVideos() {
  const list = document.getElementById("videoList");
  list.textContent = "Inapakia video...";

  try {
    const snapshot = await getDocs(collection(db, "adminData"));

    list.innerHTML = "";

    if (snapshot.empty) {
      list.textContent = "Hakuna video zilizowekwa.";
      return;
    }

    snapshot.forEach((item) => {
      const video = item.data();

      const div = document.createElement("div");
      div.className = "video-item";

      const heading = document.createElement("strong");
      heading.textContent = video.title || "Video";

      const details = document.createElement("p");
      details.textContent = "Bei: TZS " + (video.price ?? 0);

      const filename = document.createElement("p");
      filename.className = "small";
      filename.textContent =
        video.videoFileName || "Video imehifadhiwa";

      div.append(heading, details, filename);
      list.appendChild(div);
    });

  } catch (error) {
    list.textContent =
      "Imeshindikana kupakia orodha: " + error.message;
  }
}

document.getElementById("logoutBtn").onclick = async () => {
  await signOut(auth);
};

</script>
</body>
</html>
